###############################################################################
#
# Ansible remediation role for profile xccdf_org.ssgproject.content_profile_cis
# Profile Title:  CIS Red Hat Enterprise Linux 7 Benchmark for Level 2 - Server
# Profile Description:
# This profile defines a baseline that aligns to the "Level 2 - Server"
# configuration from the Center for Internet Security® Red Hat Enterprise
# Linux 7 Benchmark™, v4.0.0, released 2023-12-21.
# 
# This profile includes Center for Internet Security®
# Red Hat Enterprise Linux 7 CIS Benchmarks™ content.
#
# Benchmark ID:  xccdf_org.ssgproject.content_benchmark_RHEL-7
# Benchmark Version:  0.1.73
#
# XCCDF Version:  1.2
#
# This file was generated by OpenSCAP 1.2.17 using:
